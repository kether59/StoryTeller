version: '3.8'

services:
  # ─── LLM (llama.cpp) ───────────────────────────────────────────
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: storyteller-llama
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
      - ./system-prompt.txt:/system-prompt.txt:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    command: >
      -m /models/Phi-3-mini-4k-instruct-q4.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 4096
      -c 4096
      --threads 4
    profiles:
      - llm
    networks:
      - storyteller-net
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ─── Backend Java ──────────────────────────────────────────────
  storyteller-api:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: storyteller-backend-java
    ports:
      - "8000:8000"
    environment:
      - SERVER_PORT=8000
      - DATABASE_URL=./data/storyteller.db
      - LLM_PROVIDER=llama
      - OLLAMA_URL=http://llama-cpp:8080
      - LLM_CONFIG_PATH=/app/llm_config.json
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8000
    volumes:
      - storyteller-data:/app/data
      - storyteller-config:/app/config
      - ./llm_config.json:/app/llm_config.json   # ← important
    restart: unless-stopped
    networks:
      - storyteller-net
    depends_on:
      - llama-cpp
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]   # temporairement assoupli
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ─── Frontend ──────────────────────────────────────────────────
  storyteller-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: storyteller-ui
    ports:
      - "5173:80"
    depends_on:
      - storyteller-api          # plus de condition service_healthy
    networks:
      - storyteller-net

networks:
  storyteller-net:
    driver: bridge

volumes:
  storyteller-data:
  storyteller-config: