server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Pour debug
    location /test {
        default_type text/html;
        return 200 'TEST OK - Nginx fonctionne';
    }
}